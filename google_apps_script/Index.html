<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgb(250 204 21 / 18%), transparent 32%),
          radial-gradient(circle at 80% 80%, rgb(249 115 22 / 16%), transparent 34%),
          #111827;
        color: #f9fafb;
      }

      main {
        width: min(90%, 900px);
        padding: clamp(2rem, 7vw, 5rem);
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 1.5rem;
        background: rgb(17 24 39 / 72%);
        box-shadow: 0 2rem 5rem rgb(0 0 0 / 35%);
        text-align: center;
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 5.5rem);
        line-height: 1.08;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }

      .nombre {
        display: block;
        margin-bottom: 0.3em;
        color: #facc15;
      }

      .detalle {
        display: block;
        font-size: 0.48em;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .reproductor {
        position: fixed;
        width: 1px;
        height: 1px;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <span class="nombre">CHACÓN,</span>
        <span class="detalle">MANDAME EL CORTE ÉLITE</span>
      </h1>
    </main>

    <div class="reproductor" id="reproductor" aria-hidden="true"></div>

    <script>
      const tiktokVideoId = <?!= tiktokVideoIdJson ?>;
      const contenedor = document.querySelector('#reproductor');

      function reproducir() {
        const iframe = contenedor.querySelector('iframe');
        iframe?.contentWindow.postMessage(
          { type: 'play', value: null, 'x-tiktok-player': true },
          'https://www.tiktok.com'
        );
      }

      if (tiktokVideoId) {
        const iframe = document.createElement('iframe');
        iframe.src =
          `https://www.tiktok.com/player/v1/${tiktokVideoId}` +
          '?autoplay=1&loop=1&controls=0&music_info=0&description=0&muted=0';
        iframe.allow = 'autoplay; fullscreen';
        iframe.title = 'Música de TikTok';
        iframe.setAttribute('tabindex', '-1');
        contenedor.appendChild(iframe);

        window.addEventListener('message', (event) => {
          if (
            event.origin === 'https://www.tiktok.com' &&
            event.data?.['x-tiktok-player'] &&
            event.data.type === 'onPlayerReady'
          ) {
            reproducir();
          }
        });

        iframe.addEventListener('load', reproducir);
      } else {
        console.error(
          'Configura TIKTOK_URL con un enlace completo que contenga /video/.'
        );
      }
    </script>
  </body>
</html>

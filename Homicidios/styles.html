  <style>

    :root {
      --ink:#19322c;
      --forest:#173c34;
      --sage:#68867d;
      --cream:#f5f1e9;
      --paper:#fffdf9;
      --terracotta:#b5653e;
      --danger:#9f3b35;
      --line:#dedbd2;
      --muted:#6d7773;
      --shadow:0 20px 55px rgba(23,60,52,.12);
    }


    * {
      box-sizing:border-box;
    }


    body {
      margin:0;
      background:var(--cream);
      color:var(--ink);
      font-family:'DM Sans',sans-serif;
    }


    button,
    input,
    select,
    textarea {
      font:inherit;
    }


    button {
      cursor:pointer;
    }


    /* =====================================================
       ESTRUCTURA GENERAL
    ===================================================== */

    .shell {
      display:grid;
      grid-template-columns:420px 1fr;
      min-height:100vh;
    }


    .rail {
      padding:30px 28px;
      background:var(--forest);
      color:#fff;
      position:relative;
      overflow:hidden;
    }


    .rail:after {
      content:'';
      position:absolute;
      width:280px;
      height:280px;
      border:1px solid rgba(255,255,255,.09);
      border-radius:50%;
      right:-130px;
      top:120px;
    }


    .brand {
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
      letter-spacing:.02em;
    }


    .brand-mark {
      display:grid;
      place-items:center;
      width:38px;
      height:38px;
      border:1px solid rgba(255,255,255,.3);
      border-radius:50%;
      font-size:17px;
    }


    .eyebrow {
      margin:68px 0 14px;
      color:#d3a282;
      font-size:11px;
      font-weight:700;
      letter-spacing:.19em;
      text-transform:uppercase;
    }


    .rail h1 {
      font:600 43px/1.04 'Playfair Display',serif;
      margin:0;
      max-width:340px;
    }


    .rail .intro {
      color:#bed0ca;
      line-height:1.65;
      margin:22px 0 32px;
      max-width:335px;
    }


    .stats {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }


    .stat {
      padding:18px;
      border-top:1px solid rgba(255,255,255,.19);
    }


    .stat strong {
      display:block;
      font:600 28px 'Playfair Display',serif;
    }


    .stat span {
      color:#a9c0b9;
      font-size:12px;
    }


    .privacy {
      position:absolute;
      bottom:28px;
      left:28px;
      right:28px;
      color:#8eaaa2;
      font-size:11px;
      line-height:1.5;
    }


    .content {
      padding:28px 34px 50px;
      min-width:0;
    }


    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:24px;
    }


    .topbar h2 {
      font:600 27px 'Playfair Display',serif;
      margin:0;
    }


    .actions {
      display:flex;
      gap:10px;
    }


    /* =====================================================
       BOTONES
    ===================================================== */

    .btn {
      border:0;
      border-radius:9px;
      padding:11px 15px;
      font-weight:700;
      font-size:13px;
    }


    .btn-primary {
      background:var(--terracotta);
      color:#fff;
      box-shadow:0 8px 18px rgba(181,101,62,.25);
    }


    .btn-light {
      background:var(--paper);
      color:var(--ink);
      border:1px solid var(--line);
    }


    .btn-danger {
      background:var(--danger);
      color:#fff;
      border:1px solid var(--danger);
    }


    .btn-danger:hover {
      background:#84302c;
    }


    /* =====================================================
       FILTROS
    ===================================================== */

    .filters {
      display:grid;
      grid-template-columns:1.4fr repeat(2,1fr);
      gap:10px;
      margin-bottom:18px;
    }


    .field {
      position:relative;
    }


    .field input,
    .field select,
    .form-field input,
    .form-field select,
    .form-field textarea {
      width:100%;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--paper);
      padding:11px 12px;
      color:var(--ink);
      outline:none;
    }


    .field input:focus,
    .field select:focus,
    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color:var(--sage);
      box-shadow:0 0 0 3px rgba(104,134,125,.12);
    }


    /* =====================================================
       ÁREA DE TRABAJO
    ===================================================== */

    .workspace {
      display:grid;
      grid-template-columns:minmax(440px,.9fr) minmax(400px,1.25fr);
      gap:18px;
    }


    .panel {
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:15px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }


    .panel-head {
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }


    .panel-head h3 {
      font-size:14px;
      margin:0;
    }


    .count {
      color:var(--muted);
      font-size:12px;
    }


    /* =====================================================
       FICHAS
    ===================================================== */

    .records {
      height:610px;
      overflow:auto;
    }


    .empty {
      padding:60px 28px;
      text-align:center;
      color:var(--muted);
    }


    .record {
      display:grid;
      grid-template-columns:86px minmax(0,1fr) 120px;
      gap:15px;
      padding:16px 18px;
      border-bottom:1px solid #ebe8e1;
      cursor:pointer;
      transition:.2s;
      align-items:center;
    }


    .record:hover,
    .record.active {
      background:#f2eee6;
    }


    .thumb {
      width:86px;
      height:92px;
      object-fit:cover;
      background:#dce4e0;
      border-radius:8px;
    }


    .record-info {
      min-width:0;
    }


    .record h4 {
      margin:2px 0 6px;
      font:600 17px 'Playfair Display',serif;
      overflow-wrap:anywhere;
    }


    .meta {
      color:var(--muted);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.07em;
    }


    .place {
      font-size:12px;
      margin-top:8px;
      overflow-wrap:anywhere;
    }


    .record-buttons {
      display:flex;
      flex-direction:column;
      gap:8px;
      justify-self:end;
      align-items:stretch;
    }


    .record-buttons .btn {
      width:120px;
      padding:8px 10px;
      font-size:12px;
    }


    /* =====================================================
       MAPA
    ===================================================== */

    .map-panel {
      position:relative;
    }


    .map {
      height:610px;
    }


    .location-pin {
      width:28px;
      height:28px;
      background:#d93025;
      border:3px solid #fff;
      border-radius:50% 50% 50% 0;
      box-shadow:0 2px 7px rgba(0,0,0,.4);
      transform:rotate(-45deg);
    }


    .location-pin:after {
      content:'';
      position:absolute;
      width:8px;
      height:8px;
      left:7px;
      top:7px;
      border-radius:50%;
      background:#fff;
    }


    .map-overlay {
      position:absolute;
      left:18px;
      right:18px;
      bottom:18px;
      z-index:500;
      background:rgba(255,253,249,.96);
      border-radius:11px;
      padding:15px 17px;
      box-shadow:0 8px 30px rgba(17,41,35,.18);
      display:none;
    }


    .map-overlay.show {
      display:block;
    }


    .map-overlay h4 {
      margin:0 0 5px;
      font-family:'Playfair Display',serif;
    }


    .map-overlay p {
      margin:0;
      color:var(--muted);
      font-size:12px;
    }


    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
      position:fixed;
      inset:0;
      background:rgba(13,31,27,.63);
      z-index:1000;
      display:none;
      padding:24px;
      overflow:auto;
    }


    .modal.show {
      display:grid;
      place-items:center;
    }


    .dialog {
      width:min(850px,100%);
      background:var(--paper);
      border-radius:16px;
      box-shadow:0 30px 90px rgba(0,0,0,.25);
    }


    .dialog-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 24px;
      border-bottom:1px solid var(--line);
    }


    .dialog-head h3 {
      margin:0;
      font:600 23px 'Playfair Display',serif;
    }


    .close {
      border:0;
      background:transparent;
      font-size:24px;
      color:var(--muted);
    }


    form {
      padding:22px 24px;
    }


    .form-grid {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
    }


    .form-field label {
      display:block;
      font-size:11px;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      margin-bottom:7px;
    }


    .form-field.full {
      grid-column:1/-1;
    }


    .form-field textarea {
      min-height:90px;
      resize:vertical;
    }


    .victim-row {
      display:flex;
      gap:8px;
      margin-bottom:7px;
    }

    .photo-drop {
      display:flex !important;
      align-items:center;
      gap:14px;
      border:1px dashed #aab8b3;
      border-radius:9px;
      padding:14px;
      background:#f8f6f0;
      cursor:pointer;
    }


    .photo-preview {
      width:72px;
      height:60px;
      border-radius:7px;
      object-fit:cover;
      display:none;
    }


    .dialog-actions {
      display:flex;
      justify-content:flex-end;
      gap:10px;
      padding-top:20px;
    }


    /* =====================================================
       TOAST / CARGA
    ===================================================== */

    .toast {
      position:fixed;
      right:28px;
      top:28px;
      z-index:2000;
      background:var(--ink);
      color:#fff;
      padding:13px 17px;
      border-radius:8px;
      box-shadow:var(--shadow);
      transform:translateY(-80px);
      opacity:0;
      transition:.25s;
    }


    .toast.show {
      transform:none;
      opacity:1;
    }


    .loader {
      opacity:.55;
      pointer-events:none;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media(max-width:1050px) {

      .shell {
        grid-template-columns:1fr;
      }

      .rail {
        padding:25px 28px;
      }

      .rail .eyebrow {
        margin-top:35px;
      }

      .rail h1 {
        font-size:36px;
      }

      .privacy {
        display:none;
      }

      .workspace {
        grid-template-columns:1fr;
      }

      .records {
        height:400px;
      }

      .map {
        height:480px;
      }
    }


    @media(max-width:650px) {

      .content {
        padding:22px 15px;
      }

      .topbar {
        align-items:flex-start;
        gap:15px;
      }

      .actions {
        flex-direction:column;
      }

      .filters,
      .form-grid {
        grid-template-columns:1fr;
      }

      .form-field.full {
        grid-column:auto;
      }

      .workspace {
        display:flex;
        flex-direction:column;
      }

      .map-panel {
        order:-1;
      }

      .map {
        height:420px;
      }

      .modal {
        padding:8px;
      }

      .rail h1 {
        font-size:32px;
      }

      .record {
        grid-template-columns:72px minmax(0,1fr);
      }

      .thumb {
        width:72px;
        height:82px;
      }

      .record-buttons {
        grid-column:1/-1;
        width:100%;
        flex-direction:row;
      }

      .record-buttons .btn {
        width:auto;
        flex:1;
      }
    }
    /* =====================================================
      BOTÓN MI UBICACIÓN DEL MAPA
      ===================================================== */
      .location-control {
        background:#fff;
        width:38px;
       height:38px;
       border:0;
       border-radius:6px;
       box-shadow:0 1px 5px rgba(0,0,0,.35);
       display:flex;
       align-items:center;
       justify-content:center;
       cursor:pointer;
       font-size:20px;
       color:#173c34;
      }

      .location-control:hover {
        background:#f4f1ea;
      }

      .location-control.locating {
        opacity:.55;
        pointer-events:none;
      }

      /* =====================================================
   USUARIOS / ROLES
===================================================== */

body.auth-loading .shell {
  visibility:hidden;
}


.user-badge {
  display:block;
  margin-top:5px;
  color:var(--sage);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
}


.access-denied {
  position:fixed;
  inset:0;
  z-index:99999;
  background:var(--cream);
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
}


.access-denied.show {
  display:flex;
}


.access-denied-card {
  width:min(430px,100%);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  padding:38px 30px;
  text-align:center;
  box-shadow:var(--shadow);
}


.access-denied-icon {
  font-size:40px;
  margin-bottom:15px;
}


.access-denied-card h2 {
  margin:0 0 10px;
  font-family:'Playfair Display',serif;
  color:var(--forest);
}


.access-denied-card p {
  color:var(--muted);
  line-height:1.6;
}


/* =====================================================
   MODO OFICIAL
===================================================== */


body.role-official #exportBtn {
  display:none !important;
}


body.role-official .filters {
  display:none;
}


body.role-official .workspace {
  grid-template-columns:1fr;
}


/*
 * Oculta el panel completo de fichas.
 */
body.role-official .workspace > .panel:first-child {
  display:none;
}


body.role-official .map-panel {
  width:100%;
}


body.role-official .map {
  height:620px;
}


body.role-official #newBtn {
  min-width:160px;
}


/* =====================================================
   OFICIAL EN TELÉFONO
===================================================== */

@media(max-width:650px) {

  body.role-official .content {
    padding:14px;
  }


  body.role-official .topbar {
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    margin-bottom:14px;
  }


  body.role-official .topbar h2 {
    font-size:25px;
  }


  body.role-official .actions {
    width:100%;
  }


  body.role-official #newBtn {
    width:100%;
    min-height:52px;
    font-size:15px;
  }


  body.role-official .workspace {
    display:block;
  }


  body.role-official .map {
    height:55vh;
    min-height:340px;
  }


  /*
   * Formulario a pantalla completa
   * para trabajar cómodamente desde teléfono.
   */
  body.role-official .modal {
    padding:0;
  }


  body.role-official .dialog {
    width:100%;
    min-height:100vh;
    border-radius:0;
  }


  body.role-official form {
    padding:18px 16px;
  }


  body.role-official .form-field input,
  body.role-official .form-field select,
  body.role-official .form-field textarea {
    font-size:16px;
    min-height:48px;
  }


  body.role-official .dialog-actions {
    flex-direction:column-reverse;
  }


  body.role-official .dialog-actions .btn {
    width:100%;
    min-height:50px;
  }

}

  </style>
